<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>What's New in WALKn</title>
  <meta name="description" content="Every WALKn update: the same notes the app shows under Support, and the latest version on Google Play." />
  <link rel="icon" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Roboto:ital,wght@1,900&family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&display=swap" />
  <!--
    15 · WHAT'S NEW (player, 2026-09-30: "a change log link that gets automatically updated with the changelog the
    app pushes; include the latest app version"). Nothing on this page is typed: it renders changelog.json, which
    scripts/site_changelog.py writes from the LIVE Remote Config - the `version_changelog` the app shows under
    Support > What's new, cut at `latest_version`, the version a player can install today - at the end of every
    `whats_new.py push` and `nudge_now.py` deploy. A release in review is on neither the site nor the chip until
    its nudge goes out. The page is the site's editorial palette over the unlit road, dimmed.
  -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d13;
      --ink: #e8ecf3;
      --ink-2: #b7bfcd;
      --label: #8a93a6;
      --crimson: #ff1e27;
      --gold: #ffd700;
      --verified: #2fbf6e;
      --ed-ink: #ebe8e1;
      --ed-mute: #9a978f;
      --display: "Barlow Condensed", "Arial Narrow", sans-serif;
      --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --editorial: "Inter Tight", "Inter", -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
    :root[data-theme="dark"] { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; }
    .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 24px; }

    /* the road, far down it and unlit, held still behind everything */
    .road { position: fixed; inset: 0; z-index: -1; background: #070a0f url(img/hero_road_nopool.webp) 72% 40% / cover no-repeat; }
    .road::after { content: ""; position: absolute; inset: 0;
      background: radial-gradient(120% 90% at 60% 30%, rgba(7,10,15,.72), rgba(7,10,15,.95) 70%), linear-gradient(180deg, rgba(7,10,15,.2), #070a0f 92%); }

    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 6px 14px rgba(0,0,0,.5); }
    .wordmark { font-family: Roboto, var(--body); font-weight: 900; font-style: italic; font-size: 26px; letter-spacing: -1px; line-height: 1; color: #fff; }
    .wordmark b { color: var(--crimson); font-weight: 900; font-size: .82em; display: inline-block; }
    .wordmark .sa { position: relative; display: inline-block; }
    .wordmark .sa i { position: absolute; left: 50%; top: 52%; width: .91em; height: calc(.91em * .175); background: var(--crimson); border-radius: 1px; transform: translate(-50%, -50%) rotate(-24deg); }
    .gp { display: block; line-height: 0; transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
    .gp img { height: 44px; width: auto; }
    .gp:hover, .gp:focus-visible { transform: translateY(-2px) scale(1.04); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }

    .intro { padding: clamp(40px, 9vh, 96px) 0 clamp(28px, 5vh, 48px); }
    .eyebrow { font: 700 13px/1 var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
    h1 { font-family: var(--editorial); font-weight: 600; font-size: clamp(40px, 6.4vw, 72px); line-height: 1; letter-spacing: -.032em; color: var(--ed-ink); margin: 18px 0 18px; text-wrap: balance; }
    h1 em { font-style: normal; color: var(--crimson); }
    .stand { max-width: 620px; font: 500 clamp(16px, 1.9vw, 19px)/1.55 var(--editorial); color: var(--ed-mute); }
    .stand b { color: var(--ed-ink); font-weight: 600; }
    .stand .ver { display: inline-block; padding: 1px 9px; margin: 0 2px; border: 1px solid rgba(255,215,0,.4); border-radius: 999px; font: 700 .82em/1.5 var(--display); letter-spacing: .06em; color: var(--gold); vertical-align: .08em; }

    /* one release per row: the version in the left column, its notes on the right, a hairline between */
    .log { list-style: none; padding-bottom: 72px; }
    .rel { position: relative; display: grid; grid-template-columns: 200px 1fr; gap: 32px; padding: 34px 0 36px; }
    .rel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(235,232,225,.14); transform-origin: 0 50%; }
    .rel-v { font: 800 clamp(34px, 4.4vw, 46px)/1 var(--display); letter-spacing: .01em; color: var(--ed-ink); }
    .rel-v small { display: block; margin-top: 10px; font: 700 12px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ed-mute); }
    .rel.latest .rel-v { color: var(--gold); }
    .rel.latest .rel-v small { color: var(--gold); opacity: .8; }
    /* arriving from one of the homepage's Earlier links: that release's version lights up once */
    .rel.landed .rel-v { animation: landed 2.4s ease .3s both; }
    @keyframes landed { 0%, 100% { color: var(--ed-ink); text-shadow: none; } 25% { color: var(--gold); text-shadow: 0 0 30px rgba(255,180,40,.45); } }
    .sec + .sec { margin-top: 22px; }
    .sec h3 { display: flex; align-items: center; gap: 10px; font: 700 13px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ed-mute); margin-bottom: 12px; }
    /* each section wears the app's Material glyph in its colour, in a fine ring (the homepage's What's new frames) */
    .sec.new { --c: var(--gold); --ico: url(img/icon_new.svg); } .sec.improved { --c: #3d7bff; --ico: url(img/icon_improved.svg); } .sec.fixed { --c: var(--verified); --ico: url(img/icon_fixed.svg); }
    .ic { position: relative; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
      background: color-mix(in srgb, var(--c) 12%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 22%, transparent); }
    .ic::after { content: ""; position: absolute; inset: 5px; background: var(--c); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
    .sec ul { list-style: none; display: grid; gap: 9px; }
    .sec li { position: relative; padding-left: 18px; font: 500 16px/1.55 var(--editorial); color: var(--ink-2); }
    .sec li::before { content: ""; position: absolute; left: 2px; top: .72em; width: 6px; height: 1px; background: rgba(235,232,225,.35); }
    .rel.latest .sec li { color: var(--ed-ink); }
    .older { margin: 0 0 72px; border-top: 1px solid rgba(235,232,225,.14); }
    .older summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 26px 0; font: 700 14px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ed-mute); transition: color .25s ease; }
    .older summary::-webkit-details-marker { display: none; }
    .older summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-3px) rotate(45deg); transition: transform .35s ease; }
    .older[open] summary::after { transform: translateY(2px) rotate(-135deg); }
    .older summary:hover { color: var(--ed-ink); }
    .older .log { padding-bottom: 0; }
    .log + .older { margin-top: -36px; }
    .state { padding: 40px 0 96px; font: 500 16px/1.55 var(--editorial); color: var(--ed-mute); }
    .state a { color: var(--ed-ink); }

    /* each release arrives as it scrolls in: its hairline draws, then the version, then the notes */
    @media (prefers-reduced-motion: no-preference) {
      .intro > * { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
      .intro .eyebrow { animation-delay: .05s; } .intro h1 { animation-delay: .15s; } .intro .stand { animation-delay: .3s; }
      .rel::before { transform: scaleX(0); transition: transform 1.1s cubic-bezier(.6,0,.2,1); }
      .rel > * { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
      .rel > :last-child { transition-delay: .12s; }
      .rel.in::before { transform: none; }
      .rel.in > * { opacity: 1; transform: none; }
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    footer { position: relative; padding: 24px 0 28px; background: rgba(7,10,15,.55); }
    footer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(235,232,225,.16); }
    footer .wrap { max-width: 1240px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
    .foot-credit { display: flex; align-items: center; gap: 12px; font: 500 13px/1.35 var(--editorial); color: var(--ed-mute); }
    .foot-credit b { display: block; font-weight: 600; color: var(--ed-ink); }
    .foot-credit img { width: 64px; }

    @media (max-width: 760px) {
        .wordmark { font-size: 22px; }
      .gp img { height: 36px; }
      .wrap { padding: 0 16px; }
      .rel { grid-template-columns: 1fr; gap: 16px; padding: 28px 0 30px; }
      .rel-v small { display: inline; margin: 0 0 0 10px; }
      footer .wrap { flex-direction: column; align-items: flex-start; gap: 14px; }
      }

    /* ================= 15.6 = R (player's pick): this page caught up with the homepage =================
       A the section chips (15.2) in place of the mix bar, each jumping to its section; navigation, scrolling and the landing
       flash in crimson (17.7), gold for content only. B the homepage's top bar pinned, this page marked in crimson; the
       footer keeps only the studio credit. C every release named in a pinned strip, the one being read in crimson. */
    .jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .jump { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 4px; border: 0; border-radius: 999px; cursor: pointer;
      background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 38%, transparent); transition: transform .35s cubic-bezier(.3,1.5,.5,1), background .25s ease, box-shadow .25s ease; }
    .jump.new { --c: var(--gold); --ico: url(img/icon_new.svg); } .jump.improved { --c: #3d7bff; --ico: url(img/icon_improved.svg); } .jump.fixed { --c: var(--verified); --ico: url(img/icon_fixed.svg); }
    .jump .ic { width: 20px; height: 20px; } .jump .ic::after { inset: 4px; }
    .jump .jl { font: 700 10.5px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ed-ink); }
    .jump .jn { font: 800 13px/1 var(--display); color: var(--c); }
    .jump:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 0 0 1px var(--c); }
    .jump:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
    .sec.lit { animation: sec-lit 1.4s ease-out both; }
    @keyframes sec-lit { 0% { background: color-mix(in srgb, var(--c) 14%, transparent); } 100% { background: transparent; } }
    body a:focus-visible { outline-color: #ff1e27; }
    body { scrollbar-color: rgba(255,30,39,.7) #070a0f; }
    body .older summary:hover { color: #ff5058; }
    body footer nav a[aria-current] { color: #ff5058; }
    body .rel.landed .rel-v { animation-name: landed-c; }
    @keyframes landed-c { 0%, 100% { color: var(--ed-ink); text-shadow: none; } 25% { color: #ff5058; text-shadow: 0 0 30px rgba(255,30,39,.5); } }
    body .rel.latest.landed .rel-v { animation-name: none; }
    .sbar { display: flex; position: sticky; top: 0; z-index: 30; height: 64px; align-items: center; gap: 16px; padding: 0 24px;
      background: linear-gradient(180deg, rgba(7,10,15,.86), rgba(7,10,15,.66)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(235,232,225,.1); }
    .sbar nav { display: flex; gap: 4px; margin: 0 auto; }
    .sbar nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; text-decoration: none; font: 600 14px/1 var(--editorial); color: var(--ed-mute); white-space: nowrap; transition: color .25s ease, background .25s ease; }
    .sbar nav a i { width: 16px; height: 16px; background: currentColor; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; opacity: .8; }
    .sbar nav a:hover { color: var(--ed-ink); background: rgba(255,30,39,.08); }
    .sbar nav a[aria-current] { color: #fff; background: linear-gradient(180deg, #ff3a42, #ff1e27 60%, #d3121b); box-shadow: 0 0 16px rgba(255,30,39,.4); }
    .sbar .gp img { height: 38px; }
    .vstrip { display: flex; position: sticky; top: 64px; z-index: 29; gap: 2px; padding: 6px 16px; overflow-x: auto; scrollbar-width: none; justify-content: safe center;
      background: rgba(7,10,15,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(235,232,225,.08); }
    .vstrip button { flex: none; border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 999px; font: 700 11.5px/1 var(--display); letter-spacing: .12em; color: var(--ed-mute); transition: color .25s ease, background .25s ease; }
    .vstrip button:hover { color: var(--ed-ink); }
    .vstrip button.on { color: #ff5058; background: rgba(255,30,39,.12); }
    .vstrip button:focus-visible { outline: 2px solid #ff1e27; outline-offset: 2px; }
    .rel { scroll-margin-top: 118px; } .sec { scroll-margin-top: 112px; border-radius: 12px; }
    @media (max-width: 760px) {
      .sbar { padding: 0 12px !important; gap: 8px !important; }
      .sbar nav a span { display: none; } .sbar nav a { padding: 10px; } .sbar .wordmark { display: none; } .sbar .gp img { height: 32px; }
      .vstrip { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="road" aria-hidden="true"></div>
  <header class="sbar">
    <a class="brand" href="index.html" aria-label="WALKn home"><img src="img/icon.png" alt="" width="34" height="34" /><span class="wordmark">W<span class="sa">A<i></i></span>LK<b>n</b></span></a>
    <nav aria-label="Site">
      <a href="index.html"><i style="--ico: url(img/icon_home.svg)" aria-hidden="true"></i><span>Home</span></a>
      <a href="changelog.html" aria-current="page"><i style="--ico: url(img/icon_new.svg)" aria-hidden="true"></i><span>What's new</span></a>
      <a href="privacy.html"><i style="--ico: url(img/pv_choices.svg)" aria-hidden="true"></i><span>Privacy</span></a>
      <a href="delete-data.html"><i style="--ico: url(img/pv_delete.svg)" aria-hidden="true"></i><span>Delete your data</span></a>
      <a href="mailto:ostracizedinnovations@gmail.com"><i style="--ico: url(img/pv_mail.svg)" aria-hidden="true"></i><span>Contact</span></a>
    </nav>
    <a class="gp" href="https://play.google.com/store/apps/details?id=com.walkn.app.walkn"><img src="img/google-play-badge.png" alt="Get it on Google Play" width="564" height="168" /></a>
  </header>
  <nav class="vstrip" aria-label="Releases"></nav>
  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">What's new</p>
      <h1>Every update, <em>as it ships.</em></h1>
      <p class="stand" id="stand">The same notes WALKn shows under Support › What's new.</p>
    </section>
    <ol class="log" id="log" aria-label="Releases"></ol>
    <details class="older" id="older" hidden><summary></summary><ol class="log" id="log-older" aria-label="Earlier releases"></ol></details>
    <p class="state" id="state">Loading the notes…</p>
  </main>

  <footer>
    <div class="wrap">
      <p class="foot-credit"><img src="img/oi_mark.webp" alt="" width="531" height="379" /><span>© 2026<b>Ostracized Innovations</b></span></p>
    </div>
  </footer>

  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.walkn.app.walkn';
      var ORDER = ['New', 'Improved', 'Fixed'];
      var strip = document.querySelector('.vstrip'), older = document.getElementById('log-older'), fold = document.getElementById('older'), log = document.getElementById('log'), state = document.getElementById('state'), stand = document.getElementById('stand');
      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function fail() { state.innerHTML = 'The notes could not load just now. They are also on <a href="' + PLAY + '">Google Play</a>, under What\'s new.'; }
      function reveal() {
        var rows = [].slice.call(document.querySelectorAll('.rel'));
        if (!('IntersectionObserver' in window)) { rows.forEach(function (r) { r.classList.add('in'); }); return; }
        var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' });
        rows.forEach(function (r) { io.observe(r); });
      }
      fetch('changelog.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
        if (!j || !/^\d+\.\d+\.\d+$/.test(j.latest || '') || !Array.isArray(j.releases) || !j.releases.length) return fail();
        stand.textContent = 'The same notes WALKn shows under Support › What\'s new. The latest version on Google Play is ';
        stand.appendChild(el('span', 'ver', 'v' + j.latest)); stand.appendChild(document.createTextNode('.'));
        j.releases.forEach(function (rel, n) {
          var li = el('li', 'rel' + (rel.version === j.latest ? ' latest' : '')); li.id = 'v' + rel.version.replace(/\./g, '-');
          var v = el('div', 'rel-v', rel.version); v.appendChild(el('small', null, rel.version === j.latest ? 'Latest' : 'Version'));
          var secs = (rel.sections || []).filter(function (x) { return x.lines && x.lines.length; }).sort(function (a, b) { return ORDER.indexOf(a.heading) - ORDER.indexOf(b.heading); });
          // the homepage's section chips (15.2), in place of the mix bar: icon, colour, count - a chip jumps to that section
          var jm = el('span', 'jumps'); secs.forEach(function (x) {
            var key = String(x.heading).toLowerCase(), b = el('button', 'jump ' + key); b.type = 'button';
            var ic = el('i', 'ic'); ic.setAttribute('aria-hidden', 'true'); b.appendChild(ic); b.appendChild(el('span', 'jl', x.heading)); b.appendChild(el('b', 'jn', String(x.lines.length)));
            b.setAttribute('aria-label', x.heading + ', ' + x.lines.length + (x.lines.length === 1 ? ' change' : ' changes') + ' in ' + rel.version);
            b.addEventListener('click', function () { var t = li.querySelector('.sec.' + key); if (!t) return; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); t.classList.remove('lit'); void t.offsetWidth; t.classList.add('lit'); });
            jm.appendChild(b);
          }); v.appendChild(jm);
          var sb = el('button', null, rel.version); sb.type = 'button'; sb.dataset.id = li.id;
          sb.addEventListener('click', function () { if (older.contains(li)) fold.open = true; li.classList.add('in'); li.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
          strip.appendChild(sb);
          var body = el('div', 'rel-b');
          (rel.sections || []).slice().sort(function (a, b) { return ORDER.indexOf(a.heading) - ORDER.indexOf(b.heading); }).forEach(function (s) {
            if (!s.lines || !s.lines.length) return;
            var sec = el('section', 'sec ' + String(s.heading).toLowerCase()), h3 = el('h3'), ic = el('i', 'ic'); ic.setAttribute('aria-hidden', 'true');
            h3.appendChild(ic); h3.appendChild(document.createTextNode(s.heading)); sec.appendChild(h3);
            var ul = el('ul'); s.lines.forEach(function (t) { ul.appendChild(el('li', null, t)); }); sec.appendChild(ul); body.appendChild(sec);
          });
          li.appendChild(v); li.appendChild(body); (n < 5 ? log : older).appendChild(li);
        });
        if (older.children.length) { fold.hidden = false; fold.querySelector('summary').textContent = 'Earlier updates · ' + older.children.length + ' more, back to ' + j.releases[j.releases.length - 1].version; }
        fold.addEventListener('toggle', function () { if (fold.open) [].forEach.call(older.children, function (r) { r.classList.add('in'); }); });
        state.remove(); reveal();
        var land = function () {
          var target = location.hash && document.getElementById(location.hash.slice(1)); if (!target) return;
          if (older.contains(target)) fold.open = true;
          target.classList.add('in', 'landed'); target.scrollIntoView({ block: 'start' });
        };
        land(); window.addEventListener('hashchange', land);
        // C / R: the strip lights the release at the top of the page, and keeps it in view
        function spy() {
          var line = strip.getBoundingClientRect().bottom + 30, cur = null;
          [].forEach.call(document.querySelectorAll('.rel'), function (r) { var b = r.getBoundingClientRect(); if (b.height && b.top <= line) cur = r; });
          [].forEach.call(strip.children, function (b) {
            var on = !!cur && b.dataset.id === cur.id; if (on && !b.classList.contains('on')) strip.scrollTo({ left: b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
            b.classList.toggle('on', on);
          });
        }
        addEventListener('scroll', spy, { passive: true }); fold.addEventListener('toggle', spy); spy();
      }).catch(fail);
    })();
  </script>
</body>
</html>
